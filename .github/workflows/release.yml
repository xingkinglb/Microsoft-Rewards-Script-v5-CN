name: 打包发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 完整历史：release-notes.js 要靠上一个 tag 算更新范围
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装依赖
        working-directory: app
        run: npm ci --include=dev

      - name: 构建内核
        working-directory: app
        run: npm run build

      - name: 下载便携版 Node 运行时
        shell: pwsh
        run: |
          $version = '24.22.2'
          $url = "https://nodejs.org/dist/v$version/node-v$version-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node-tmp
          New-Item -ItemType Directory -Force -Path runtime | Out-Null
          Move-Item "node-tmp\node-v$version-win-x64" "runtime\node"
          Remove-Item node.zip -Recurse -Force
          Remove-Item node-tmp -Recurse -Force
          & "runtime\node\node.exe" --version

      - name: 写入版本号
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: node -e "const fs=require('fs');fs.writeFileSync('manager/version.json',JSON.stringify({version:process.env.TAG.replace(/^v/,'')},null,4)+'\n','utf8')"

      - name: 打包（含安全检查）
        run: node scripts/package.js --zip

      - name: 上传构建产物
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Microsoft-Rewards-Script-v5
          path: dist-package/Microsoft-Rewards-Script-v5.zip
          retention-days: 7

      - name: 生成发布说明
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.js

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-package/Microsoft-Rewards-Script-v5.zip
          body_path: release-notes.md
